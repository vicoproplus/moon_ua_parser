# CI for the moon_ua_parser library.
#
# Moon project root is the `moon_ua_parser_lib/` subdirectory; the generator
# scripts live in repo-root `scripts/`; the `uap-core/` and `uap-python/`
# snapshots are vendored and read-only.
#
# Toolchain pinning: the official installer is
#   curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
# (https://www.moonbitlang.com/download/), and the official moonbitlang/core
# CI setup action pins a version by passing it to the same script:
#   curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s "<version>"
# (https://github.com/moonbitlang/core/blob/main/.github/actions/setup/action.yml)
# NFR: CI must pin the exact toolchain version 0.1.20260904. Upstream removed
# the per-version download paths on 2026-09-13: binaries/0.1.20260904/... and
# cores/core-0.1.20260904.tar.gz now return S3 403 AccessDenied, and only the
# "latest" alias still serves artifacts (it resolves to exactly 0.1.20260904,
# verified 2026-09-13; evidence: docs/evidence/final-gate-2026-09-13.log).
# So we transport via "latest" and HARD-ASSERT the exact version in the
# "Verify toolchain" step: if upstream ever ships a different build under
# "latest", CI fails loudly instead of silently drifting.

name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: check / gen-consistency / native / js / wasm / diffstats
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Install PyYAML (pinned, used by the generator scripts)
        run: python -m pip install PyYAML==6.0.2

      - name: Install MoonBit CLI (transport=latest; exact version asserted below)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s "latest"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain (assert exact pin 0.1.20260904)
        run: |
          moon version --all
          moon version | grep -F "0.1.20260904"

      - name: Refresh mooncakes registry index
        # Fresh runners have no cached index — 2026-09-13 finding: `moon check`
        # failed with "Failed to resolve registry dependency moonbitlang/regexp"
        # (exit 255) until `moon update` cloned the index; evidence
        # docs/evidence/final-gate-2026-09-13.log
        timeout-minutes: 5
        run: moon update

      # ---------------------------------------------------------------------
      # v0.2 framework middleware (T-06) — INSERTED before the first moon
      # command; the existing steps below are untouched (PRD 10.6 S3).
      #
      # The moon workspace (moon.work) resolves ONE shared dependency graph
      # for all members into the root .mooncakes/ (gitignored, so a fresh
      # checkout starts without it; the first workspace-level moon command
      # fetches it). That graph MVS-unifies moonbitlang/async to 0.21.3 (the
      # pin of mizchi/mars@0.3.12), which breaks bobzhang/crescent@0.11.1's
      # Map[String, String] request-header code, and no published version
      # pair coexists (T-02/T-05 registry matrix). The fetched cache is
      # therefore adapted from the committed patch files below, before any
      # member package is compiled. Empirically the member-directory steps
      # below (moon check / moon test in moon_ua_parser_lib) already resolve
      # and check the whole workspace graph, so this step must precede them.
      # `moon install` (deprecated no-arg form, still the explicit
      # dependency-fetch trigger) forces the fetch here so the patch lands
      # between fetch and first compilation.
      - name: Apply framework cache patches (post-fetch, pre-build)
        timeout-minutes: 15
        working-directory: .
        run: |
          moon install
          git -c core.autocrlf=false apply --check scripts/framework-cache-patches/*.patch
          git -c core.autocrlf=false apply scripts/framework-cache-patches/*.patch

      - name: Static check
        working-directory: moon_ua_parser_lib
        run: moon check

      - name: Interface drift check (moon info)
        working-directory: moon_ua_parser_lib
        run: |
          moon info
          git diff --exit-code -- '*.mbti' '**/*.mbti'

      - name: Generation consistency (regenerated output must be byte-identical)
        working-directory: moon_ua_parser_lib
        run: |
          python ../scripts/gen_rules.py
          python ../scripts/gen_tests.py
          git diff --exit-code -- src/ua_parser/rules tests/differential

      - name: Tests (native)
        timeout-minutes: 30
        working-directory: moon_ua_parser_lib
        run: moon test --target native

      - name: Tests (js)
        timeout-minutes: 15
        working-directory: moon_ua_parser_lib
        run: moon test --target js

      # preferred_target is wasm in moon.mod, so this is the wasm runtime gate.
      # Bare `moon test` is structurally red on every platform: the generated
      # debug-codegen wasm module of tests/differential declares 125,840 locals
      # in its package-init function, over the V8 engine's 50,000 hard cap, so
      # moonrun (V8-based everywhere) rejects the module statically before any
      # test runs. CI never surfaced this because this workflow had 0 runs.
      # Evidence: docs/evidence/wasm-differential-blocker-2026-09-13.md.
      # Followup-1 (split tests/differential into several packages in
      # scripts/gen_tests.py, then regenerate) is the registered fix that
      # restores the wasm differential test gate. Until then, the gate is the
      # 7 non-differential packages, listed explicitly (28 tests, proven green
      # on wasm).
      - name: Tests (wasm, default target)
        timeout-minutes: 15
        working-directory: moon_ua_parser_lib
        run: |
          # moonc link-core of the generated diffstats/differential wasm test
          # driver recurses deeper than Linux's default 8 MiB main-thread stack
          # (moonc ICE "Stack overflow" on stock Linux, repro'd 2026-09-13;
          # RUST_MIN_STACK alone does not help). Raise the limit for the link.
          ulimit -s unlimited
          moon test -p . -p examples/middleware -p src/ua_parser -p src/ua_parser/rules -p tests/diffstats -p tests/robust -p tests/semantics

      - name: Build (wasm)
        timeout-minutes: 15
        working-directory: moon_ua_parser_lib
        run: moon build --target wasm

      # Final evidence line: the differential gate table
      # (browser >= 99% / os >= 97% / device >= 97%).
      - name: Differential gate report
        timeout-minutes: 15
        working-directory: moon_ua_parser_lib
        run: moon run --target native --release tests/diffstats

      # Same three-domain report on the default wasm target. Unlike the
      # debug/test module of tests/differential (structurally blocked, see the
      # wasm test gate above), --release codegen folds the corpus literals:
      # the largest function declares 26,857 locals, inside the V8 50,000 cap,
      # and the report is byte-identical to native/js
      # (docs/evidence/diffstats-wasm-2026-09-13.txt).
      - name: Wasm differential gate report
        timeout-minutes: 15
        working-directory: moon_ua_parser_lib
        run: moon run --target wasm --release tests/diffstats

      # Perf smoke gate (T-06 of 性能基准): pass/fail is decided by the calibrated
      # coarse threshold SMOKE_NS_PER_PARSE_LIMIT in tests/bench/main.mbt
      # (recalibrate there if this step ever misfires). The full four-field
      # report always prints before a non-zero abort.
      - name: Perf smoke (native)
        timeout-minutes: 15
        working-directory: moon_ua_parser_lib
        run: moon run --target native --release tests/bench -- --smoke

      # The new workspace-level middleware steps are standardized on
      # --target native for determinism (the plan's backfilled literals use
      # native; local wasm-gc test runs are broken on Windows, a documented
      # environment fact). The lib steps above keep their historical target
      # matrix unchanged.
      - name: Workspace build (middleware)
        timeout-minutes: 30
        working-directory: .
        run: moon build --target native

      # Middleware integration tests: one moon test -p selector per
      # framework adapter (crescent = header mounting, mars = Variables
      # mounting); run from the repo root against the shared workspace graph.
      - name: Middleware integration tests (crescent + mars)
        timeout-minutes: 15
        working-directory: .
        run: |
          moon test --target native -p moon_ua_parser_crescent
          moon test --target native -p moon_ua_parser_mars

      # Warning-baseline gate (final-review recommendation): the
      # workspace-wide `moon check --target native` warning set must never
      # grow. Baseline recalibrated 2026-09-13 after the 平台完备 unit's
      # deprecation cleanup merged: 18 (9 deprecated + 8 deprecated_syntax
      # + 1 unused_constructor, all inside moon_ua_parser_lib; pre-cleanup
      # baseline was 44), and zero deprecated-family warnings may appear
      # outside moon_ua_parser_lib (the middleware packages stay clean;
      # they use derive(Debug)). Warning blocks are multi-line — the
      # ╭─[path] header line precedes the Warning text line — so awk
      # associates each warning with its block path. A failing check
      # (real errors) fails this step directly.
      - name: Warning baseline gate (no growth; deprecated outside lib = 0)
        timeout-minutes: 15
        working-directory: .
        run: |
          OUT=$(moon check --target native 2>&1)
          TOTAL=$(printf '%s\n' "$OUT" | grep -c "Warning (" || true)
          DEP_OUT=$(printf '%s\n' "$OUT" | awk '/╭─\[/{path=$0} /Warning \(deprecated/{if (path !~ /moon_ua_parser_lib/) n++} END{print n+0}')
          echo "total warnings: $TOTAL (baseline 18, may shrink, never grow)"
          echo "deprecated warnings outside moon_ua_parser_lib: $DEP_OUT (must be 0)"
          [ "$TOTAL" -le 18 ] && [ "$DEP_OUT" -eq 0 ]
